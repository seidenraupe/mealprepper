name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
